name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/react/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time -- a slower run started earlier should never
# clobber a newer one that finished first.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Storybook
        working-directory: packages/react
        run: npm run build-storybook
        env:
          # This repo is served at https://<user>.github.io/custody-sdk/ (a
          # project site, not a user/org root site), so asset paths need the
          # /custody-sdk/ prefix -- see .storybook/main.js's viteFinal.
          STORYBOOK_BASE_PATH: /custody-sdk/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/react/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
