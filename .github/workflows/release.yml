name: Release

# Verifiable Inaya Client SOW: this is what turns "npm publish by hand, no CI, no
# published hash" into a reviewable, reproducible pipeline. Every step's output feeds
# docs/VERIFYING_RELEASES.md's third-party verification instructions -- if a step here
# changes, that doc needs updating to match.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # attach checksums/tarball to the GitHub Release, push CHECKSUMS.md
  id-token: write    # required for npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git archive/log need real history, not a shallow clone

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Derive version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG.md must be updated for this release
        run: |
          if ! git diff --name-only "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)" HEAD | grep -q '^CHANGELOG\.md$'; then
            echo "::error::CHANGELOG.md wasn't updated since the last tag. Add a real entry for ${{ steps.version.outputs.version }} before releasing."
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Compute checksums
        id: checksums
        run: |
          npm pack
          TARBALL=$(ls inaya-network-custody-sdk-*.tgz)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "npm_sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "tree_sha256=$(git archive HEAD | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Pin release to IPFS
        id: pin
        env:
          INAYA_RELEASE_PINATA_JWT: ${{ secrets.INAYA_RELEASE_PINATA_JWT }}
        run: |
          CID=$(node scripts/pin-release.mjs "${{ steps.checksums.outputs.tarball }}" "${{ steps.version.outputs.version }}")
          echo "cid=$CID" >> "$GITHUB_OUTPUT"

      - name: Record checksums in CHECKSUMS.md
        run: |
          cat >> CHECKSUMS.md << EOF

          ## ${{ github.ref_name }} ($(date -u +%Y-%m-%d))
          - git-tree-sha256: \`${{ steps.checksums.outputs.tree_sha256 }}\`
          - npm-tarball-sha256: \`${{ steps.checksums.outputs.npm_sha256 }}\`
          - ipfs-cid: \`${{ steps.pin.outputs.cid }}\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHECKSUMS.md
          git commit -m "Record checksums for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach tarball and checksums to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.checksums.outputs.tarball }}
          body: |
            **SHA-256 (git tree):** `${{ steps.checksums.outputs.tree_sha256 }}`
            **SHA-256 (npm tarball):** `${{ steps.checksums.outputs.npm_sha256 }}`
            **IPFS CID:** `${{ steps.pin.outputs.cid }}`

            See [docs/VERIFYING_RELEASES.md](https://github.com/Talhawaqas/custody-sdk/blob/main/docs/VERIFYING_RELEASES.md) to reproduce and verify this release yourself.
